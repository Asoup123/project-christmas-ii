<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT : CHRISTMAS II // COMMAND CENTER</title>
<style>
:root{--r:#8f1d24;--g:#173c32;--c:#f3ead7;--gold:#c9a86a;--w:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:"Courier New",monospace;color:#302e2a}
.hidden{display:none!important}.wrap{width:min(1180px,calc(100% - 24px));margin:28px auto}.file{background:var(--c);padding:32px;border:1px solid #aa9473;box-shadow:0 18px 45px #0005}
.code,.eye{letter-spacing:2px;font-size:12px}.code{color:var(--r);font-weight:bold}.eye{margin-top:24px;color:#756a59}
h1{font-size:clamp(34px,7vw,64px);line-height:.9;color:var(--g);margin:8px 0 22px}h1 span{display:block;color:var(--r)}
.line{height:2px;background:var(--gold);margin-bottom:25px}.login{max-width:450px;margin:30px auto}
label{display:block;font-size:12px;letter-spacing:2px;margin-bottom:8px}input,button{width:100%;padding:15px;font:inherit}
input{background:var(--w);border:1px solid #b7a788;font-size:18px}button{border:0;background:var(--g);color:white;font-weight:bold;letter-spacing:2px;margin-top:12px;cursor:pointer}
.err{color:var(--r);font-weight:bold;margin-top:12px;min-height:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid #c6b798;padding:16px}.card small{display:block;color:#746958}.card strong{font-size:26px;color:var(--g)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;font-size:13px}.bar button{width:auto;margin:0;background:var(--r)}
.table{overflow:auto;border:1px solid #c6b798}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:12px;border-bottom:1px solid #d4c8b0;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--g);color:white;font-size:11px;letter-spacing:1px}.agent{color:var(--r);font-weight:bold}.empty{text-align:center;padding:32px}
@media(max-width:650px){.wrap{width:calc(100% - 12px);margin:6px auto}.file{padding:22px 14px}.stats{grid-template-columns:1fr}.bar{align-items:stretch;flex-direction:column}.bar button{width:100%}}
</style></head><body><div class="wrap">
<section class="file" id="login"><div class="code">XMAS-II / RESTRICTED ADMINISTRATIVE ACCESS</div><div class="eye">AUTHORIZED PERSONNEL ONLY</div><h1>COMMAND <span>CENTER</span></h1><div class="line"></div>
<div class="login"><label>ADMIN ACCESS CODE</label><input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="輸入管理代碼"><button id="enter">驗證管理權限</button><div class="err" id="err"></div></div></section>

<section class="file hidden" id="dash"><div class="code">PROJECT : CHRISTMAS II / RESPONSE DATABASE</div><div class="eye">MISSION RESPONSE CONTROL</div><h1>RESPONSE <span>DATABASE</span></h1><div class="line"></div>
<div class="stats"><div class="card"><small>CONFIRMED RESPONSES</small><strong id="count">0</strong></div><div class="card"><small>AVAILABLE DRIVERS</small><strong id="drivers">0</strong></div><div class="card"><small>DOUBLE BED REQUESTS</small><strong id="double">0</strong></div></div>
<div class="bar"><span id="status">DATABASE CONNECTING...</span><button id="refresh">重新整理資料</button></div>
<div class="table"><table><thead><tr><th>AGENT</th><th>交通方式</th><th>可載人數</th><th>住宿偏好</th><th>室友</th><th>備註</th><th>提交時間</th></tr></thead><tbody id="body"></tbody></table></div></section>
</div><script>
const URL="https://sdkgiedglmhmchiietru.supabase.co";
const KEY="sb_publishable_ofwe1YigppMHJjcWu_VjUA_XF7wNzEm";
const CODE="0420";
const $=id=>document.getElementById(id);
$("enter").onclick=login;$("code").onkeydown=e=>{if(e.key==="Enter")login()};$("refresh").onclick=load;
function login(){if($("code").value.trim()!==CODE){$("err").textContent="ACCESS DENIED // 管理代碼錯誤";$("code").value="";return}$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}
async function load(){
 $("status").textContent="DATABASE CONNECTING...";$("body").innerHTML='<tr><td class="empty" colspan="7">正在讀取資料...</td></tr>';
 try{
  const r=await fetch(URL+"/rest/v1/christmas_2026_rsvp?select=id,created_at,name,travel,people,stay_pref,roommate,note&order=created_at.desc",{headers:{apikey:KEY}});
  if(!r.ok)throw new Error(await r.text());const rows=await r.json();
  $("count").textContent=rows.length;$("drivers").textContent=rows.filter(x=>x.travel==="自己開車").length;
  $("double").textContent=rows.filter(x=>x.stay_pref==="雙人床"||x.stay_pref==="希望睡雙人床").length;
  $("body").innerHTML="";
  if(!rows.length)$("body").innerHTML='<tr><td class="empty" colspan="7">目前尚無已確認回覆</td></tr>';
  rows.forEach(x=>{const tr=document.createElement("tr");[
   x.name||"—",x.travel||"—",x.travel==="自己開車"&&x.people!==null?x.people+" 位":"—",x.stay_pref||"—",x.roommate||"—",x.note||"—",time(x.created_at)
  ].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===0)td.className="agent";tr.appendChild(td)});$("body").appendChild(tr)});
  $("status").textContent="DATABASE ONLINE // "+rows.length+" RECORD(S)";
 }catch(e){console.error(e);$("status").textContent="DATABASE ERROR";$("body").innerHTML='<tr><td class="empty" colspan="7">資料讀取失敗，請稍後再試。</td></tr>'}
}
function time(v){return v?new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(v)):"—"}
</script></body></html>
