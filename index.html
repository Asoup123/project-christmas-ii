<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PROJECT : CHRISTMAS II</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #8f1d24;
      --dark-red: #5e1016;
      --green: #173c32;
      --cream: #f3ead7;
      --gold: #c9a86a;
      --white: #fffdf8;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(143,29,36,.22), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(23,60,50,.35), transparent 40%),
        #101412;
      color: var(--cream);
      overflow-x: hidden;
    }

    /* 背景格線 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .05;
      background-image:
        linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .snow span {
      position: absolute;
      top: -30px;
      color: rgba(255,255,255,.5);
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      z-index: 2;
    }

    .file {
      width: min(100%, 560px);
      position: relative;
      padding: 45px 30px 34px;
      background: var(--cream);
      color: #252520;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      border-radius: 3px;
      transform: rotate(-0.4deg);
    }

    .file::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(40,40,35,.2);
      pointer-events: none;
    }

    .top-secret {
      position: absolute;
      right: 22px;
      top: 20px;
      padding: 5px 11px;
      border: 2px solid var(--red);
      color: var(--red);
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 2px;
      transform: rotate(5deg);
      opacity: .85;
    }

    .file-number {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: #777064;
      margin-bottom: 40px;
    }

    .eyebrow {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--red);
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 9vw, 64px);
      line-height: .95;
      letter-spacing: -2px;
      color: #171a17;
    }

    h1 span {
      display: block;
      color: var(--red);
      font-style: italic;
      margin-top: 8px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #b8ad98;
      margin: 28px 0;
    }

    .classified {
      font-size: 13px;
      line-height: 1.9;
      color: #5e594f;
    }

    .classified strong {
      color: var(--green);
    }

    .verification {
      margin-top: 32px;
      padding: 24px 20px;
      background: rgba(23,60,50,.07);
      border-left: 4px solid var(--green);
    }

    .verification-title {
      font-family: monospace;
      color: var(--green);
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    .verification p {
      color: #5e594f;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .input-wrap {
      display: flex;
      gap: 8px;
    }

    input {
      min-width: 0;
      flex: 1;
      height: 48px;
      border: 1px solid #9f9789;
      background: rgba(255,255,255,.55);
      padding: 0 14px;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      color: #222;
      border-radius: 0;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(23,60,50,.1);
    }

    button {
      height: 48px;
      border: 0;
      padding: 0 19px;
      background: var(--green);
      color: var(--white);
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: .2s;
    }

    button:hover {
      background: #245647;
      transform: translateY(-1px);
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      color: #8f1d24;
      border: 1px solid rgba(143,29,36,.35);
      background: rgba(143,29,36,.07);
    }

    .message.success {
      display: block;
      color: #173c32;
      border: 1px solid rgba(23,60,50,.35);
      background: rgba(23,60,50,.08);
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-end;
      margin-top: 34px;
      color: #827a6c;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 1px;
    }

    .seal {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(143,29,36,.65);
      color: rgba(143,29,36,.75);
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 8px;
      font-weight: bold;
      transform: rotate(-12deg);
    }

    .christmas-mark {
      position: absolute;
      left: -12px;
      top: -18px;
      width: 55px;
      height: 55px;
      background: var(--red);
      border-radius: 50%;
      border: 5px solid #101412;
      display: grid;
      place-items: center;
      font-size: 23px;
      box-shadow: 0 5px 15px rgba(0,0,0,.3);
    }

    @media (max-width: 520px) {
      .file {
        padding: 40px 22px 28px;
      }

      .input-wrap {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .top-secret {
        right: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="snow" id="snow"></div>

  <main class="page">

    <section class="file">

      <div class="christmas-mark">✦</div>

      <div class="top-secret">
        CLASSIFIED
      </div>

      <div class="file-number">
        FILE NO. XMAS-II / 2026 / 1225
      </div>

      <div class="eyebrow">
        RESTRICTED ACCESS
      </div>

      <h1>
        PROJECT :
        <span>CHRISTMAS II</span>
      </h1>

      <div class="line"></div>

      <div class="classified">
        本文件包含 <strong>PROJECT : CHRISTMAS II</strong>
        機密行動資訊。<br>
        僅限本次受邀成員閱覽。<br><br>

        未經授權者，請立即關閉本頁。
      </div>

      <div class="verification">

        <div class="verification-title">
          IDENTITY VERIFICATION
        </div>

        <p>
          請輸入你的行動代號以確認身分。
        </p>

        <div class="input-wrap">
          <input
            type="text"
            id="agentCode"
            placeholder="輸入行動代號"
            autocomplete="off"
          >

          <button onclick="verifyAgent()">
            驗證身分
          </button>
        </div>

        <div id="message" class="message"></div>

      </div>

      <div class="bottom">

        <div>
          DATE OF OPERATION<br>
          25 DEC 2026<br><br>
          SECURITY LEVEL : II
        </div>

        <div class="seal">
          PROJECT<br>
          CHRISTMAS<br>
          II
        </div>

      </div>

    </section>

  </main>

  <script>
    /*
      第一版先放測試代號。
      等你把正式 14 人名單確認後，
      我們會整批換成正式名單。
    */
    const allowedAgents = [
      "TEST",
      "ㄊㄔㄒ"
    ];

    function verifyAgent() {

      const input = document.getElementById("agentCode");
      const message = document.getElementById("message");

      const code = input.value.trim();

      message.className = "message";

      if (!code) {
        message.textContent = "請輸入行動代號。";
        message.classList.add("error");
        return;
      }

      if (allowedAgents.includes(code)) {

        message.innerHTML =
          "<strong>ACCESS GRANTED</strong><br>" +
          "身分驗證成功。正在開啟機密行動資料……";

        message.classList.add("success");

        /*
          下一步我們會把這裡改成
          正式進入民宿資訊頁。
        */

      } else {

        message.innerHTML =
          "<strong>ACCESS DENIED</strong><br>" +
          "查無此行動代號。你不在本次行動授權名單中。";

        message.classList.add("error");

      }
    }

    /* Enter 也可以驗證 */
    document.getElementById("agentCode")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          verifyAgent();
        }
      });

    /* 簡單雪花效果 */
    const snow = document.getElementById("snow");

    for (let i = 0; i < 28; i++) {

      const flake = document.createElement("span");

      flake.textContent = "•";
      flake.style.left = Math.random() * 100 + "%";
      flake.style.fontSize = (Math.random() * 14 + 7) + "px";
      flake.style.animationDuration =
        (Math.random() * 8 + 8) + "s";
      flake.style.animationDelay =
        (Math.random() * -15) + "s";

      snow.appendChild(flake);
    }
  </script>

</body>
</html>
